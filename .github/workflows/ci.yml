name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: vendor/bin/pint --test
      - run: composer audit

      # Dependensi runtime wajib bebas kerentanan high ke atas.
      - run: npm audit --omit=dev --audit-level=high

      # Build tooling (rantai Tailwind v3: braces/micromatch/chokidar/fast-glob/
      # postcss-selector-parser) hanya berjalan di mesin build, bukan di produksi,
      # dan baru bersih setelah migrasi Tailwind v4. Sementara ini hanya kerentanan
      # critical yang memblokir pipeline.
      - run: npm audit --audit-level=critical

      # memory_limit bawaan PHP (128M) membuat proses PHPStan crash di proyek ini.
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G
      - run: npm run build
      - run: php artisan test --compact
